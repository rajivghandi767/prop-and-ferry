[project]
name = "prop-and-ferry-backend"
version = "0.1.0"
description = "Backend API and Route Stitcher for Prop & Ferry"
requires-python = ">=3.14"
dependencies = [
    "beautifulsoup4",
    "django>=5.2,<7.0",
    "django-filter",
    "django-prometheus",
    "djangorestframework",
    "redis",
    "requests",
]

[dependency-groups]
prod = [
    "gunicorn",
    "psycopg",
]
dev = [
    "django-cors-headers",
    "psycopg[binary]",
    "pytest",
    "pytest-django",
]
