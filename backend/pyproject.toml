[project]
name = "prop-and-ferry-backend"
version = "0.1.0"
description = "Backend API and Route Stitcher for Prop & Ferry"
requires-python = ">=3.14"
dependencies = [
    "beautifulsoup4",
    "django",
    "django-prometheus",
    "djangorestframework",
    "redis",
    "requests",
]

[dependency-groups]
prod = [
    "gunicorn",
    "psycopg",
]
dev = [
    "django-cors-headers",
    "django-stubs[compatible-mypy]",
    "djangorestframework-stubs[compatible-mypy]",
    "mypy",
    "psycopg[binary]",
    "types-beautifulsoup4",
    "types-requests",
]
